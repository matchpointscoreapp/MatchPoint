<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MatchPoint</title>
<meta name="theme-color" content="#050605">
<link rel="icon" href="assets/matchpoint-icon.png">
<link rel="apple-touch-icon" href="assets/matchpoint-icon.png">
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/site.js" defer></script>
</head>
<body>
<header><div class="wrap nav">
<a class="brand" href="index.html"><img src="assets/matchpoint-icon.png" alt="MatchPoint"><span>MatchPoint</span></a>
<div class="nav-right"><nav><a href="index.html" class="active" data-i18n="nav.home"></a><a href="features.html" data-i18n="nav.features"></a><a href="facts.html" data-i18n="nav.facts"></a><a href="watch.html" data-i18n="nav.watch"></a><a href="faq.html" data-i18n="nav.faq"></a><a href="support.html" data-i18n="nav.support"></a></nav>
<select id="langSelect" class="lang-select" aria-label="Language"><option value="nl">Nederlands</option><option value="en">English</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="es">Español</option><option value="pt">Português</option></select></div>
</div></header>
<main>
<section class="hero"><div class="wrap hero-grid">
  <div>
    <div class="kicker" data-i18n="home.kicker"></div>
    <h1><span data-i18n="home.title1"></span><br><span class="accent" data-i18n="home.title2"></span></h1>
    <p class="lead" data-i18n="home.lead"></p>
    <div class="cta-row"><a class="btn primary" href="features.html" data-i18n="home.cta1"></a><a class="btn secondary" href="watch.html" data-i18n="home.cta2"></a></div>
    <div class="platform-note"><span class="dot"></span><span data-i18n="home.available"></span></div>
  </div>
  <div class="hero-visual">
    <figure class="product-shot iphone-shot"><img src="assets/screenshots/iphone-home.webp" alt="MatchPoint on iPhone"></figure>
    <figure class="product-shot watch-shot"><img src="assets/screenshots/watch-score.webp" alt="MatchPoint on Apple Watch"></figure>
  </div>
</div></section>

<section class="section alt"><div class="wrap">
  <div class="section-head"><div class="kicker" data-i18n="home.sports.kicker"></div><h2 data-i18n="home.sports.title"></h2><p class="lead" data-i18n="home.sports.lead"></p></div>
  <div class="feature-with-shot">
    <div class="grid-2 feature-cards">
      <div class="card"><h3 data-i18n="feat.1t"></h3><p data-i18n="feat.1d"></p></div>
      <div class="card"><h3 data-i18n="feat.4t"></h3><p data-i18n="feat.4d"></p></div>
      <div class="card"><h3 data-i18n="feat.2t"></h3><p data-i18n="feat.2d"></p></div>
      <div class="card"><h3 data-i18n="feat.3t"></h3><p data-i18n="feat.3d"></p></div>
    </div>
    <figure class="phone-showcase"><img src="assets/screenshots/iphone-new-match.webp" alt="New Match in MatchPoint"></figure>
  </div>
</div></section>

<section class="section"><div class="wrap watch-home-grid">
  <div class="watch-stack">
    <figure><img src="assets/screenshots/watch-score.webp" alt="MatchPoint score on Apple Watch"></figure>
    <figure><img src="assets/screenshots/watch-controls.webp" alt="MatchPoint controls on Apple Watch"></figure>
  </div>
  <div>
    <div class="kicker" data-i18n="home.watchsec.kicker"></div><h2 data-i18n="home.watchsec.title"></h2><p class="lead" data-i18n="home.watchsec.lead"></p>
    <ul class="list"><li><strong data-i18n="watch.l2t"></strong> <span data-i18n="watch.l2d"></span></li><li><strong data-i18n="home.haptic"></strong> <span data-i18n="watch.l1d"></span></li><li><strong data-i18n="watch.l3t"></strong> <span data-i18n="watch.l3d"></span></li></ul>
    <div class="cta-row"><a class="btn secondary" href="watch.html" data-i18n="home.cta2"></a></div>
  </div>
</div></section>

<section class="section alt"><div class="wrap">
  <div class="section-head"><div class="kicker" data-i18n="home.around.kicker"></div><h2 data-i18n="home.around.title"></h2><p class="lead" data-i18n="home.around.lead"></p></div>
  <div class="screen-gallery three"><figure><img src="assets/screenshots/iphone-players.webp" alt="Players in MatchPoint"></figure><figure><img src="assets/screenshots/iphone-settings.webp" alt="Settings in MatchPoint"></figure><figure><img src="assets/screenshots/iphone-home.webp" alt="MatchPoint home screen"></figure></div>
</div></section>

<section class="section"><div class="wrap language-grid">
  <div><div class="kicker" data-i18n="home.lang.kicker"></div><h2 data-i18n="home.lang.title"></h2><p class="lead" data-i18n="home.lang.lead"></p><div class="language-chips"><span>Nederlands</span><span>English</span><span>Deutsch</span><span>Français</span><span>Español</span><span>Português</span></div></div>
  <figure class="phone-showcase small-phone"><img src="assets/screenshots/iphone-settings.webp" alt="Language settings in MatchPoint"></figure>
</div></section>

<section class="section alt"><div class="wrap">
  <div class="section-head"><div class="kicker" data-i18n="home.facts.kicker"></div><h2 data-i18n="home.facts.title"></h2></div>
  <div class="grid-3"><div class="stat"><strong>6</strong><span data-i18n="home.stat1"></span></div><div class="stat"><strong>2</strong><span data-i18n="home.stat2"></span></div><div class="stat"><strong>2</strong><span data-i18n="home.stat3"></span></div><div class="stat"><strong>3</strong><span data-i18n="home.stat4"></span></div><div class="stat"><strong>2</strong><span data-i18n="home.stat5"></span></div><div class="stat"><strong>0</strong><span data-i18n="home.stat6"></span></div></div>
  <div class="privacy-note"><h3 data-i18n="home.privacy.title"></h3><p data-i18n="home.privacy.text"></p></div>
  <div class="cta-row"><a class="btn secondary" href="facts.html" data-i18n="home.morefacts"></a></div>
</div></section>

<section class="section"><div class="wrap platform-grid"><div><div class="kicker" data-i18n="home.platform.kicker"></div><h2 data-i18n="home.platform.title"></h2><p class="lead" data-i18n="home.platform.text"></p></div><div class="platform-card"><div class="platform-icon"></div><div><strong>iPhone + Apple Watch</strong><div class="small">MatchPoint 1.0</div></div></div></div></section>

<section class="section"><div class="wrap"><div class="cta-band"><div><h2 data-i18n="home.final.title"></h2><p data-i18n="home.final.text"></p></div><span class="btn primary disabled-cta" data-i18n="home.final.cta"></span></div></div></section>
</main>
<footer><div class="wrap footer-grid"><div><div class="footer-brand"><img src="assets/matchpoint-icon.png" alt=""><span>MatchPoint</span></div><div class="small" data-i18n="footer.tagline"></div></div><div class="small"><a href="privacy.html" data-i18n="footer.privacy"></a> · <a href="support.html" data-i18n="footer.support"></a><br><a href="mailto:matchpointscoreapp@gmail.com">matchpointscoreapp@gmail.com</a><br>© 2026 MatchPoint</div></div></footer>
</body></html>
